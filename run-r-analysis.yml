name: R Project Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-r-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Check R script syntax
        shell: Rscript {0}
        run: |
          files <- list.files(
            pattern = "\\.R$",
            recursive = TRUE,
            full.names = TRUE
          )

          if (length(files) == 0) {
            stop("No R scripts found.")
          }

          for (file in files) {
            cat("Checking:", file, "\n")
            parse(file = file)
          }

          cat("All R scripts passed syntax validation.\n")
