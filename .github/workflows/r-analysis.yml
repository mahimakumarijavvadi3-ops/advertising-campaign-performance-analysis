name: Reproducible R Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Run complete analysis
        run: Rscript run_all.R

      - name: Verify generated outputs
        run: |
          test -f outputs/clean_advertising_campaigns.csv
          test -f outputs/platform_summary.csv
          test -f outputs/monthly_summary.csv
          test -f outputs/model_metrics.csv
          test -f outputs/key_platform_insights.csv
